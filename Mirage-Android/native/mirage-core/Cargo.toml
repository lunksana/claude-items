[package]
name = "mirage-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Mirage-rs 移动端裁剪内核: Mirage 隧道协议 + TUN 引擎 (平台无关)"
# 纯平台无关核心: Android 由 mirage-jni 包装, iOS 由 mirage-ios 包装

[lib]
name = "mirage_core"
crate-type = ["rlib"]

[dependencies]
anyhow = "1.0.102"
arc-swap = "1.9.1"
fastrand = "2.0.1"
hkdf = "0.13.0"
hmac = "0.13.0"
poly1305 = "0.9.0"
rand = "0.10.1"
regex = "1.12.4"
ring = "0.17"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
sha2 = "0.11.0"
subtle = "2.6"
tokio = { version = "1.52.3", features = ["full", "net", "rt", "rt-multi-thread"] }
tracing = "0.1.44"
hex = "0.4.3"
libc = "0.2.186"
smoltcp = { version = "0.13", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv4-fragmentation", "proto-ipv6", "socket-tcp", "socket-udp", "async", "log"] }
# TUN 设备抽象: Android (mirage-jni) 与 iOS 共用; v1 直接用 fd (unix)

[dev-dependencies]
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
clap = { version = "4.6.1", features = ["derive"] }

[[example]]
name = "tun_e2e"
path = "examples/tun_e2e.rs"
